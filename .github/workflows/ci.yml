# CI — runs on every push and PR to dev/main.
# GATE: all three jobs must pass for a PR to merge.
# Configure branch protection on dev and main to require the "gate" status check.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Moddable-Games/moddable-rules
          path: moddable-rules
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Unit tests (run in band to avoid performance test flake)
        run: npx jest --no-coverage --runInBand
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games

  playability-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Moddable-Games/moddable-rules
          path: moddable-rules
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Playability Standard (items 1-3, all families)
        run: npx jest packages/play/__tests__/playability-standard.test.js --no-coverage --forceExit
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games
      - name: Regenerate playability manifest
        run: node scripts/gen-playability-manifest.mjs
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games
      - name: Verify manifest is up to date
        run: git diff --exit-code play/playability-manifest.json || (echo "Manifest is stale — run scripts/gen-playability-manifest.mjs" && exit 1)
      - name: Verify discovery surfaces are up to date
        run: node scripts/build-discovery.mjs --check

  playwright:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          path: moddable-engine
      - uses: actions/checkout@v4
        with:
          repository: Moddable-Games/moddable-rules
          path: moddable-rules
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
        working-directory: moddable-engine
      - run: npx playwright install --with-deps chromium
        working-directory: moddable-engine
      - name: Start dev server
        run: npx serve . -l 8080 &
      - name: Wait for server
        run: npx wait-on http://localhost:8080/moddable-engine/ --timeout 10000
      - name: Playwright e2e (playability + game-play)
        run: npx playwright test e2e/
        working-directory: moddable-engine
        env:
          BASE_URL: http://localhost:8080/moddable-engine
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: moddable-engine/test-results/

  # Gate job: branch protection should require this check.
  # All CI jobs must pass for this to succeed.
  gate:
    runs-on: ubuntu-latest
    needs: [unit-tests, playability-standard, playwright]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.playability-standard.result }}" != "success" ] || \
             [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "One or more CI jobs failed. Blocking merge."
            exit 1
          fi
          echo "All CI jobs passed."
