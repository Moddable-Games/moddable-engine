# CI — runs on every push and PR to dev/main.
# GATE: all three jobs must pass for a PR to merge.
# Configure branch protection on dev and main to require the "gate" status check.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pair the corpus branch with the branch being built. This was `ref: dev`
      # for every branch including main, which meant a run on main was not a
      # property of main at all: engine main carries a frozen
      # playability-manifest.json and the job below regenerates it against
      # whatever moddable-rules dev happens to be, then fails on the diff.
      #
      # So every rules push that changed playability turned engine main red
      # without anyone touching engine, and it stayed red until the next
      # promotion of dev to main. Measured on 2026-08-31: engine main against
      # rules dev regenerates to 201 against a committed 198 and fails, and
      # against rules main regenerates to 198 byte-identical and passes.
      #
      # `base_ref` first so a pull request pairs with the branch it targets;
      # `ref_name` is a merge ref like "123/merge" on pull_request events.
      - uses: actions/checkout@v4
        with:
          repository: Moddable-Games/moddable-rules
          path: moddable-rules
          ref: ${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'dev' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      # The whole suite used to run `--runInBand` because ONE file, the
      # nodes-per-second performance test, is sensitive to sharing a machine.
      # That confined all 173 suites to a single worker to protect one of them.
      # The performance test now runs alone, in band, in its own step, and
      # everything else uses the runner's cores.
      - name: Unit tests (fast tier)
        run: npm run test:fast -- --no-coverage
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games
      - name: Unit tests (slow tier)
        run: npm run test:slow -- --no-coverage
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games
      - name: Performance (alone, in band)
        run: npm run test:perf -- --no-coverage
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games
      # The discovery check belongs in this job, because this is the job that
      # ran the suite, and the test count is now measured from that run rather
      # than scraped out of a README line.
      - name: Verify discovery surfaces are up to date
        run: node scripts/build-discovery.mjs --check
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-counts
          path: api/test-counts.json

  playability-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Corpus branch paired with the branch being built. See the unit-tests job.
      - uses: actions/checkout@v4
        with:
          repository: Moddable-Games/moddable-rules
          path: moddable-rules
          ref: ${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'dev' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      # `playability-standard.test.js` used to run here AND inside the global
      # jest run in the unit-tests job, so every CI run paid for it twice. It is
      # in the slow tier now, which the unit-tests job runs. This job keeps the
      # generated-artefact checks that depend on it.
      - name: Regenerate playability manifest
        run: node scripts/gen-playability-manifest.mjs
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games
      - name: Verify manifest is up to date
        run: git diff --exit-code play/playability-manifest.json || (echo "Manifest is stale — run scripts/gen-playability-manifest.mjs" && exit 1)
      - name: Regenerate family defaults
        run: node scripts/gen-family-defaults.mjs
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games
      - name: Verify family defaults are up to date
        run: git diff --exit-code play/family-defaults.json || (echo "Family defaults are stale — run scripts/gen-family-defaults.mjs" && exit 1)
      # This step reads variant frontmatter through setup-rules-reader, so it
      # needs the corpus like every other step in this job. It was the only one
      # without MODDABLE_RULES_DIR, and fell back to a sibling path that does
      # not exist on a runner, failing on all 1116 standard puzzles at once.
      - name: Verify puzzles are normalised
        run: node scripts/normalise-puzzles.mjs --check
        env:
          NODE_OPTIONS: '--experimental-vm-modules'
          MODDABLE_RULES_DIR: ${{ github.workspace }}/moddable-rules/games
      - name: Duplication guard
        run: node scripts/check-duplication.mjs
      - name: Purity guard (no game knowledge in packages/)
        run: node scripts/check-purity.mjs
      - name: Dead code detection (knip)
        run: |
          UNUSED_COUNT=$(npx knip --reporter compact 2>&1 | grep -c "^" || true)
          echo "Unused exports: $UNUSED_COUNT"
          # Shrink-only baseline: 17 unused exports as of 2026-08-18
          # This ceiling must only decrease, never increase.
          if [ "$UNUSED_COUNT" -gt 17 ]; then
            echo "ERROR: Unused export count increased from baseline (17)"
            npx knip
            exit 1
          fi

  playwright:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
        with:
          path: moddable-engine
      # Corpus branch paired with the branch being built. See the unit-tests job.
      - uses: actions/checkout@v4
        with:
          repository: Moddable-Games/moddable-rules
          path: moddable-rules
          ref: ${{ (github.base_ref || github.ref_name) == 'main' && 'main' || 'dev' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
        working-directory: moddable-engine
      - run: npx playwright install --with-deps chromium
        working-directory: moddable-engine
      - name: Start dev server
        run: npx serve . -l 8080 &
      - name: Wait for server
        run: npx wait-on http://localhost:8080/moddable-engine/ --timeout 10000
      - name: Playwright e2e (playability + game-play)
        run: npx playwright test e2e/
        working-directory: moddable-engine
        env:
          BASE_URL: http://localhost:8080/moddable-engine
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: moddable-engine/test-results/

  # Gate job: branch protection should require this check.
  # All CI jobs must pass for this to succeed.
  gate:
    runs-on: ubuntu-latest
    needs: [unit-tests, playability-standard, playwright]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.playability-standard.result }}" != "success" ] || \
             [ "${{ needs.playwright.result }}" != "success" ]; then
            echo "One or more CI jobs failed. Blocking merge."
            exit 1
          fi
          echo "All CI jobs passed."
