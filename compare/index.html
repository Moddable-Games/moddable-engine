<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Variant Contact Sheet</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #eee; }
h1 { font-size: 18px; margin: 0 0 16px; opacity: 0.7; font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.card { background: #2a2a3e; border-radius: 6px; padding: 10px; }
.card svg { width: 100%; height: auto; display: block; }
.card .label { font-size: 11px; margin-top: 6px; text-align: center; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .error { color: #f66; font-size: 10px; font-family: monospace; white-space: pre-wrap; padding: 4px; }
.summary { font-size: 12px; opacity: 0.5; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Variant Contact Sheet &mdash; Generic Surface</h1>
<div class="summary" id="summary"></div>
<div class="grid" id="grid"></div>
<script type="module">
import '../packages/plugins/chess/index.js'
import { createGame } from '../packages/play/src/sdk.js'
import { listVariants } from '../packages/play/src/variant-registry.js'
import { boardToSetup } from '../packages/play/src/serialise.js'
import { renderFromEngine, attachPieceImages } from '../packages/render/src/render-engine.js'
import { loadGalleryIndex, getGalleryIndex } from '../js/play-shared.js'

await loadGalleryIndex()

const variants = listVariants('chess').sort((a, b) => a.key.localeCompare(b.key))
const grid = document.getElementById('grid')
const summary = document.getElementById('summary')

let ok = 0, fail = 0

for (const v of variants) {
  const card = document.createElement('div')
  card.className = 'card'

  try {
    const game = createGame('chess', v.key)
    const slice = game.getState().slice
    const topo = game.topology || { rows: 8, cols: 8 }
    const plugin = game.raw.registry.getPlugins().find(p => p.sliceName === 'chess')
    const vocabulary = plugin?.vocabulary || {}
    const setup = boardToSetup(slice, topo, vocabulary)
    const resolved = {
      topology: { type: 'grid', rows: topo.rows || 8, cols: topo.cols || 8 },
      render: { cellColor: 'checkered' },
      setup,
      pieces: { set: 'mce-fairy-complete' },
    }
    const gallery = getGalleryIndex() || []
    const pieceResult = attachPieceImages(resolved, gallery)
    const svg = renderFromEngine(resolved, { pieceImages: pieceResult.images || {} })
    card.innerHTML = svg || '<div class="error">No render output</div>'
    ok++
  } catch (e) {
    card.innerHTML = `<div class="error">${e.message}</div>`
    fail++
  }

  const label = document.createElement('div')
  label.className = 'label'
  label.textContent = v.key
  label.title = v.label || v.key
  card.appendChild(label)
  grid.appendChild(card)
}

summary.textContent = `${variants.length} variants: ${ok} rendered, ${fail} failed`
</script>
</body>
</html>
