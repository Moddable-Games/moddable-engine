<div class="boards-app create-layout">
  <aside class="boards-sidebar">
    <div class="sidebar-panel active">

      <div class="control-group create-drafts">
        <label class="control-label">Your boards</label>
        <div class="control-row">
          <input type="text" id="draft-name" class="def-input" placeholder="Unsaved board">
          <button class="btn btn-outline" id="draft-save-btn">Save</button>
        </div>
        <button class="btn btn-outline" id="draft-new-btn" style="margin-top:6px;font-size:11px">Start new</button>
        <div class="drafts-list" id="drafts-list"></div>
      </div>

      <div class="control-group">
        <label class="control-label">Start from</label>
        <div class="control-row">
          <select id="template-family"></select>
        </div>
        <div class="control-row" style="margin-top:6px">
          <select id="template-variant"></select>
        </div>
        <button class="btn btn-outline" id="template-load-btn" style="margin-top:6px;font-size:11px">Load as template</button>
      </div>

      <div class="control-group">
        <label class="control-label">Topology</label>
        <select id="topo-type">
          <option value="grid">Grid</option>
          <option value="hex">Hex</option>
          <option value="graph">Graph</option>
          <option value="track">Track</option>
          <option value="pit">Pit</option>
        </select>
      </div>

      <div class="control-group" id="grid-opts">
        <label class="control-label">Rows × Cols</label>
        <div class="control-row">
          <input type="number" id="grid-rows" value="8" min="2" max="36">
          <input type="number" id="grid-cols" value="8" min="2" max="36">
        </div>
        <label class="control-label" style="margin-top:8px">Grid style</label>
        <select id="grid-layout">
          <option value="cells">Cells &mdash; chess, draughts, shogi</option>
          <option value="intersections">Intersections &mdash; go, xiangqi</option>
        </select>
      </div>

      <div class="control-group" id="hex-opts" style="display:none">
        <label class="control-label">Radius</label>
        <input type="number" id="hex-radius" value="5" min="2" max="15">
      </div>

      <div class="control-group" id="graph-opts" style="display:none">
        <label class="control-label">Structure</label>
        <select id="graph-structure">
          <option value="concentric-rings">Concentric rings</option>
          <option value="perimeter-cross">Perimeter cross</option>
          <option value="grid-cross">Grid cross</option>
        </select>
        <label class="control-label" style="margin-top:8px">Rings</label>
        <input type="number" id="graph-rings" value="3" min="2" max="5">
      </div>

      <div class="control-group" id="track-opts" style="display:none">
        <label class="control-label">Positions</label>
        <input type="number" id="track-positions" value="24" min="6" max="64">
      </div>

      <div class="control-group" id="pit-opts" style="display:none">
        <label class="control-label">Pits per side</label>
        <input type="number" id="pit-cols" value="6" min="3" max="12">
      </div>

      <div class="control-group">
        <label class="control-label">Surface</label>
        <select id="surface-select">
          <option value="wood-classic">Wood Classic</option>
          <option value="wood-light">Wood Light</option>
          <option value="parchment">Parchment</option>
          <option value="earth">Earth</option>
          <option value="felt-green">Felt Green</option>
          <option value="slate">Slate</option>
          <option value="jungle">Jungle</option>
          <option value="military">Military</option>
          <option value="cosmic">Cosmic</option>
        </select>
      </div>

      <div class="control-group" id="cellcolor-group">
        <label class="control-label">Cell Style</label>
        <select id="cellcolor-select">
          <option value="checkered">Checkered</option>
          <option value="uniform">Uniform</option>
          <option value="none">None (lines only)</option>
        </select>
      </div>

      <div class="control-group" id="starpoints-group" style="display:none">
        <label class="def-check"><input type="checkbox" id="star-points"> Star points (go)</label>
      </div>

      <div class="control-group">
        <label class="control-label">Labels</label>
        <select id="labels-select">
          <option value="true">Show</option>
          <option value="false">Hide</option>
        </select>
      </div>

      <div class="control-group" style="margin-top:16px">
        <label class="control-label">Export</label>
        <div class="control-row">
          <button class="btn btn-outline" id="export-yaml-btn">YAML</button>
          <button class="btn btn-outline" id="export-svg-btn">SVG</button>
          <button class="btn btn-outline" id="export-png-btn">PNG</button>
        </div>
      </div>

    </div>
  </aside>

  <main class="boards-canvas">
    <div class="canvas-viewport" id="board-viewport">
      <div class="canvas-svg" id="board-svg"></div>
    </div>
    <div class="setup-bar">
      <label class="setup-bar__label" for="setup-input">Setup</label>
      <input class="setup-bar__input" id="setup-input" type="text" spellcheck="false"
             placeholder="place pieces, or paste a setup string here" />
      <button class="info-btn" id="setup-copy-btn">Copy</button>
      <button class="info-btn" id="try-play-btn">Try in Play</button>
    </div>
    <div class="hex-info-bar" id="hex-info-bar">
      <span class="info-text" id="info-text">Configure board and click cells to place pieces</span>
      <span class="info-status" id="create-status"></span>
      <span class="info-actions">
        <button class="info-btn" id="bar-undo-btn">Undo</button>
      </span>
    </div>
  </main>

  <aside class="boards-sidebar boards-sidebar--right">
    <div class="sidebar-panel active">

      <div class="control-group">
        <label class="control-label">Family</label>
        <select id="family-select">
          <option value="chess">Chess</option>
          <option value="shogi">Shogi</option>
          <option value="go">Go</option>
          <option value="draughts">Draughts</option>
          <option value="xiangqi">Xiangqi</option>
          <option value="reversi">Reversi</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Piece Set</label>
        <select id="pieceset-select">
          <option value="">None</option>
        </select>
      </div>

      <div class="control-group" id="piece-palette">
        <label class="control-label">Place Piece <span id="active-piece-label"></span></label>
        <div class="piece-picker" id="piece-picker"></div>
        <button class="btn btn-outline" id="clear-pieces-btn" style="margin-top:8px;font-size:11px">Clear all pieces</button>
      </div>

      <div class="control-group" id="players-group">
        <label class="control-label">Players &amp; sides</label>
        <div class="players-panel" id="players-panel"></div>
      </div>

      <div class="control-group" id="rules-group">
        <label class="control-label" id="rules-heading">Chess rules</label>
        <div class="rules-panel" id="rules-panel"></div>
      </div>

      <div class="control-group" id="piece-define-group">
        <label class="control-label">Define Piece</label>
        <div class="piece-define-form" id="piece-define-form">
          <div class="def-row">
            <input type="text" id="def-name" class="def-input def-input--name" placeholder="Name">
            <input type="text" id="def-symbol-w" class="def-input def-input--symbol" placeholder="W" maxlength="1">
            <input type="text" id="def-symbol-b" class="def-input def-input--symbol" placeholder="b" maxlength="1">
          </div>
          <select id="def-shape" class="def-select">
            <option value="rider">Rider (slides)</option>
            <option value="leaper">Leaper (jumps)</option>
            <option value="hopper">Hopper (cannon)</option>
          </select>
          <select id="def-dirs" class="def-select">
            <option value="orthogonal">Orthogonal</option>
            <option value="diagonal">Diagonal</option>
            <option value="all">All (queen)</option>
            <option value="knight">Knight offsets</option>
            <option value="elephant">Elephant offsets</option>
            <option value="camel">Camel offsets</option>
          </select>
          <div class="def-row">
            <label class="def-label">Max steps</label>
            <input type="number" id="def-maxsteps" class="def-input def-input--short" value="" min="1" max="20" placeholder="unlimited">
          </div>
          <div class="def-row def-row--checks">
            <label class="def-check"><input type="checkbox" id="def-directional"> Directional</label>
            <label class="def-check"><input type="checkbox" id="def-lame"> Lame</label>
          </div>
          <div class="def-row">
            <button class="btn btn-outline def-btn" id="def-preview-btn">Preview</button>
            <button class="btn btn-outline def-btn" id="def-add-btn">Add to palette</button>
          </div>
        </div>
        <div id="custom-pieces-list"></div>
      </div>

    </div>
  </aside>
</div>
